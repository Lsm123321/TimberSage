spring:
  # 默认激活 local 配置（backend/config/application-local.yml，不入库）；
  # Docker 部署时通过环境变量覆盖为 prod 或留空，容器内凭据全部来自环境变量
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    # 本地开发时后端直连 Docker Compose 暴露的 MySQL（宿主机端口 13307 -> 容器 3306）
    url: jdbc:mysql://localhost:13307/mortise_and_tenon_joint_library?useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    # 凭据从环境变量注入，勿在此写入真实密码；本地开发值见 backend/config/application-local.yml
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

  security:
    user:
      name: admin
      password: 123456

  minio:
    # 本地开发时后端直连 Docker Compose 暴露的 MinIO（宿主机端口 19100 -> 容器 9000）
    endpoint: http://localhost:19100
    access-key: minioadmin
    # MinIO 密钥从环境变量注入，勿在此写入真实密码
    secret-key: "${SPRING_MINIO_SECRET_KEY:}"
    bucket-name: model-bucket
    # 拼给浏览器的对象 URL 基地址；本地开发后端与浏览器同机，直接用暴露端口即可
    public-endpoint: http://localhost:19100

  deepseek:
    # API Key 一律从环境变量注入，仓库中不保存真实 Key
    api-key: ${SPRING_DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com/v1/chat/completions
    # 首 token 超过这个秒数判定主通道拥堵，自动切智谱（DeepSeek 共享通道高峰曾等 8 分钟）
    first-token-timeout-seconds: 45
    # 相邻 token 间隔超过这个秒数也切智谱（高峰实测吐字 1字/20s，整段回答出不完）
    token-gap-timeout-seconds: 20

  # 智谱 AI（TTS 语音合成 + chat 备胎）；key 通过环境变量 ZHIPU_API_KEY 注入，不配置时前端自动降级浏览器内置朗读
  zhipu:
    api-key: ${ZHIPU_API_KEY:}
    tts-url: https://open.bigmodel.cn/api/paas/v4/audio/speech
    tts-model: cogtts
    clone-url: https://open.bigmodel.cn/api/paas/v4/voice/clone
    clone-model: glm-tts-clone
    # DeepSeek 拥堵时的备用对话通道（接口规范与 OpenAI 兼容）
    chat-url: https://open.bigmodel.cn/api/paas/v4/chat/completions
    chat-model: glm-4-flash

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      # 本地开发时连接 Docker Compose 暴露的 Redis（宿主机端口 6394 -> 容器 6379）
      host: localhost
      port: 6394
      timeout: 10000

server:
  port: 8080

jwt:
  secret: your-jwt-secret-key-change-this-in-production
  expiration: 86400000  # 24 hours
  header: Authorization
  prefix: "Bearer "

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.arch3d.entity
  global-config:
    db-config:
      id-type: auto

logging:
  level:
    com.arch3d: DEBUG
    org.springframework: DEBUG
    root: ERROR

debug: true

app:
  cors:
    # 逗号分隔；生产环境请包含公网访问地址，否则浏览器带 Origin 时 CORS 会返回 403
    allowed-origin-patterns: "http://localhost:*,http://127.0.0.1:*"
  cleanup:
    rejected-retention-days: 7
  map:
    compliance:
      source: 国家地理信息公共服务平台（https://www.tianditu.gov.cn/）
      review-no: GS(2025)01340
      review-year: 2026
